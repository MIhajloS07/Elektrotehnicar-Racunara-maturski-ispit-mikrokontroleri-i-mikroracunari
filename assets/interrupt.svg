<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Prekidi (interrupt) – ISR i glavna petlja</title>
<desc id="d">Animirana vremenska linija: pritisak tastera prekida loop(), izvršava se kratka ISR rutina koja postavlja flag, pa loop() nastavlja i obrađuje događaj.</desc>
<defs>
  <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f59e0b"/></marker>
</defs>
<rect width="900" height="360" rx="16" fill="#0b1524"/>
<rect x="1" y="1" width="898" height="358" rx="15" fill="none" stroke="#1f3a5a" stroke-width="2"/>
<text x="40" y="42" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e6edf3">Prekid (interrupt) u akciji</text>
<text x="40" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8fa6bf">attachInterrupt(digitalPinToInterrupt(2), TasterISR, FALLING)</text>

<!-- lane labels -->
<text x="40" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8fa6bf">taster</text>
<text x="40" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8fa6bf">ISR</text>
<text x="40" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8fa6bf">loop()</text>

<!-- taster signal -->
<path d="M80,84 H300 V114 H360 V84 H820" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
<text x="86" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#6b7f96">HIGH (INPUT_PULLUP)</text>
<text x="292" y="132" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#f59e0b" opacity=".25">FALLING ↓
  <animate attributeName="opacity" calcMode="discrete" dur="7s" repeatCount="indefinite" keyTimes="0;0.2973;0.3784" values=".25;1;.25"/></text>
<line x1="300" y1="116" x2="300" y2="150" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar)"/>

<!-- ISR -->
<rect x="300" y="152" width="60" height="40" rx="6" fill="#f59e0b" opacity=".25">
  <animate attributeName="opacity" calcMode="discrete" dur="7s" repeatCount="indefinite" keyTimes="0;0.2973;0.3784" values=".25;1;.25"/></rect>
<text x="370" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#f59e0b">pritisnut = true;  <tspan fill="#6b7f96">← samo flag, trajanje µs</tspan></text>

<!-- loop -->
<rect x="80" y="226" width="220" height="40" rx="6" fill="#1d4ed8"/>
<text x="190.0" y="251" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#dbeafe">loop(): glavni program</text>
<rect x="360" y="226" width="200" height="40" rx="6" fill="#1d4ed8"/>
<text x="460.0" y="251" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#dbeafe">nastavlja</text>
<rect x="560" y="226" width="140" height="40" rx="6" fill="#16a34a" opacity=".3">
  <animate attributeName="opacity" calcMode="discrete" dur="7s" repeatCount="indefinite" keyTimes="0;0.6486;0.8378" values=".3;1;.3"/></rect>
<text x="630.0" y="251" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#dcfce7">if (pritisnut) {…}</text>
<rect x="700" y="226" width="120" height="40" rx="6" fill="#1d4ed8"/>
<text x="760.0" y="251" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#dbeafe">dalje</text>

<!-- strelica flag -> obrada -->
<path d="M330.0,194 C330.0,215 630.0,200 630.0,222" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar)"/>

<!-- kursor -->
<line x1="80" y1="92" x2="80" y2="276" stroke="#e6edf3" stroke-opacity=".8" stroke-width="2">
  <animateTransform attributeName="transform" type="translate" from="0 0" to="740 0" dur="7s" repeatCount="indefinite"/></line>

<line x1="40" y1="296" x2="860" y2="296" stroke="#1f3a5a"/>
<text x="40" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e6edf3">✔ ISR mora biti kratka: postavi flag i izađi. Obradu radi <tspan fill="#38bdf8">loop()</tspan>.</text>
<text x="40" y="341" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e6edf3">✔ Promenljive koje dele ISR i loop() moraju biti <tspan fill="#f59e0b">volatile</tspan>. ✘ Bez delay() u ISR-u.</text>
</svg>
